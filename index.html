<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masjid Admin Panel</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:560px;margin:0 auto;padding:16px;background:#f4f7f4}
  h2{color:#1b5e20} label{display:block;margin-top:10px;font-weight:600}
  input,textarea{width:100%;padding:10px;font-size:16px;box-sizing:border-box;border:1px solid #bbb;border-radius:8px}
  button{padding:12px 18px;font-size:16px;border:0;border-radius:8px;background:#1b5e20;color:#fff;margin-top:14px;cursor:pointer}
  button.sec{background:#666} .row{display:flex;gap:6px;margin-top:6px} .row input{flex:1}
  .card{background:#fff;padding:14px;border-radius:12px;margin-top:14px}
  #msg{margin-top:10px;font-weight:600}
</style>
</head>
<body>
<h2>Masjid Admin Panel</h2>

<div id="login" class="card">
  <label>Email</label><input id="email" type="email">
  <label>Password</label><input id="pass" type="password">
  <button onclick="login()">Login</button>
</div>

<div id="panel" style="display:none">
  <div class="card">
    <label>Masjid ka naam</label><input id="masjidName">
    <h3>Namaz Timings</h3>
    <div id="times"></div>
  </div>

  <div class="card">
    <h3>Donation</h3>
    <label>Note (optional)</label><textarea id="note" rows="2"></textarea>
    <label>QR code ka text (account number / link)</label><input id="qrText">
    <h4>Accounts</h4>
    <div id="accounts"></div>
    <button class="sec" onclick="addAcc()">+ Account add karein</button>
  </div>

  <button onclick="save()">Save karein</button>
  <button class="sec" onclick="logout()">Logout</button>
  <div id="msg"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// ===== Firebase console se apni config yahan paste karein =====
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR-PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR-PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR-PROJECT"
};
// ==============================================================
firebase.initializeApp(firebaseConfig);
const db = firebase.database().ref('masjid');
const P = [['fajr','Fajr'],['zuhr','Zuhr'],['asr','Asr'],['maghrib','Maghrib'],['isha','Isha'],['jumma','Jumma']];
const $ = id => document.getElementById(id);
const say = (t, ok=true) => { $('msg').style.color = ok ? 'green' : 'red'; $('msg').textContent = t; };

$('times').innerHTML = P.map(([k,l]) =>
  `<label>${l}</label><input type="time" id="t_${k}">`).join('');

function addAcc(a = {}) {
  const d = document.createElement('div');
  d.className = 'row acc';
  d.style.flexWrap = 'wrap';
  d.innerHTML = `
    <input placeholder="Title (JazzCash/Bank)" value="${a.title||''}" class="a_title">
    <input placeholder="Account holder" value="${a.name||''}" class="a_name">
    <input placeholder="Number / IBAN" value="${a.number||''}" class="a_number">
    <button class="sec" onclick="this.parentElement.remove()">Hatayein</button>`;
  $('accounts').appendChild(d);
}

function login() {
  firebase.auth().signInWithEmailAndPassword($('email').value, $('pass').value)
    .catch(e => alert('Login fail: ' + e.message));
}
function logout() { firebase.auth().signOut(); }

firebase.auth().onAuthStateChanged(async u => {
  $('login').style.display = u ? 'none' : 'block';
  $('panel').style.display = u ? 'block' : 'none';
  if (!u) return;
  const d = (await db.get()).val() || {};
  $('masjidName').value = d.masjidName || '';
  P.forEach(([k]) => $('t_'+k).value = (d.timings||{})[k] || '');
  const dn = d.donation || {};
  $('note').value = dn.note || '';
  $('qrText').value = dn.qrText || '';
  $('accounts').innerHTML = '';
  const accs = Array.isArray(dn.accounts) ? dn.accounts : Object.values(dn.accounts||{});
  accs.forEach(addAcc);
});

async function save() {
  const timings = {};
  P.forEach(([k]) => { if ($('t_'+k).value) timings[k] = $('t_'+k).value; });
  const accounts = [...document.querySelectorAll('.acc')].map(r => ({
    title: r.querySelector('.a_title').value,
    name: r.querySelector('.a_name').value,
    number: r.querySelector('.a_number').value
  })).filter(a => a.number);
  try {
    await db.set({
      masjidName: $('masjidName').value,
      timings,
      donation: { note: $('note').value, qrText: $('qrText').value, accounts }
    });
    say('Save ho gaya. App mein foran update ho jayega.');
  } catch (e) { say('Error: ' + e.message, false); }
}
</script>
</body>
</html>
